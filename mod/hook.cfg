enable=1
bits=0
rate=0
buffer=0
compat=1
dither=2
fade_ms=0
shared_fallback=0
src_prefer=bandwidth
hifi=0
audiohost=0
idle_release_ms=0
auto_shared=0
# 以下是面板不显示的高级项，去掉行首 # 生效（默认值如所示）：
# prime=1             新流开播前垫一个设备缓冲的静音
# resync_ms=200       44.1k 族与 48k 族之间切换时额外垫的静音（0～2000）
# event=1             独占优先事件驱动，被驱动拒绝时回退定时轮询；0 = 总是轮询
# memlock=1           音频缓冲锁在内存里
# dedicated_core=0    drain 线程独占一个快核心
# process_priority=0  接管期间提高网易云进程优先级
# host_ring_ms=500    独立音频宿主的环形缓冲深度（200～4000）
# share_quiet_ms=3000 auto_shared 下，别的应用安静多久才回到独占（500～60000）
# players_first=0     1 = 别的音乐播放器一开始播放就让给它，不等网易云暂停 15 秒
# log=1               写 sink.log
